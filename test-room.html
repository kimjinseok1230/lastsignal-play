<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>야근냥 테스트룸</title><link rel="stylesheet" href="./test-room.css?v=1"></head><body>
<header><a href="./index.html">← 게임 로비</a><strong>야근냥 테스트룸</strong><button id="pause">일시정지</button></header>
<main><details open id="controls"><summary>테스트 설정</summary><p>모든 고양이와 진화를 자유롭게 시험하세요. 실제 코인·해금·이어하기는 바뀌지 않습니다.</p>
<label>고양이<select id="cat"></select></label><p id="skill-info"></p>
<label>무기<select id="weapon"></select></label><label>진화 단계<select id="stage"><option value="0">기본 · 무기 레벨 5</option><option value="1">1차 진화</option><option value="2">최종 진화</option></select></label><p id="weapon-info"></p><small>고양이·무기·진화 변경 시 필드를 정리합니다.</small>
<div class="checks"><label><input id="god" type="checkbox" checked> 무적</label><label><input id="cooldown" type="checkbox" checked> 스킬 쿨타임 해제</label><label><input id="auto" type="checkbox" checked> 자동 조준</label><label><input id="primary" type="checkbox"> 기본 총도 발사</label><label><input id="sound" type="checkbox" checked> 사운드</label></div>
<label>적 종류<select id="enemy"><option value="stalker">일반 적</option><option value="brute">덩치 큰 적</option><option value="sniper">사격형 적</option><option value="jammer">보호막 적</option><option value="sentinel">중간 보스</option><option value="final">최종 보스</option></select></label>
<div class="buttons"><button id="spawn-one">1마리 소환</button><button id="spawn-many">20마리 소환</button></div>
<label>시간 이동<select id="time"><option value="0">00:00 · 시작</option><option value="300">05:00 · 보스</option><option value="600">10:00 · 강화 보스</option><option value="840">14:00 · 최종 보스</option></select></label>
<div class="buttons"><button id="clear">화면 정리</button><button id="heal">체력 회복</button></div></details>
<section class="field" aria-label="테스트 전투"><canvas id="world" aria-label="테스트 게임 화면" tabindex="0"></canvas><output id="stats"></output><p id="notice" role="status"></p><div class="actions"><button id="dash">대시</button><button id="skill">전용 스킬</button><button id="rush">우다다</button></div><p class="hint">WASD 이동 · E 스킬 · Space 대시<br>터치: 왼쪽 드래그 이동 / 오른쪽 드래그 조준</p></section></main><script type="module" src="./test-room.js?v=2"></script></body></html>
